name: Deploy Okey to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Firebase Config
        env:
          FB_CFG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          mkdir -p dist
          node -e '
            const fs = require("fs");
            const cfg = process.env.FB_CFG.trim();
            JSON.parse(cfg);
            const html = fs.readFileSync("index.html", "utf8");
            if (!html.includes("/*__FB_CFG__*/null")) throw new Error("FB_CFG placeholder bulunamadi!");
            fs.writeFileSync("dist/index.html", html.replace("/*__FB_CFG__*/null", cfg));
          '
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
