<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3a2a">
<title>Okey Masası</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{--ink:#1e2a22;--card:#fffaf0;--gold:#e0a82e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f3ecd8;background:#0f3a2a}
body.menu{min-height:100dvh;background:radial-gradient(ellipse at 50% 30%,#2c8d5f,#1b6a45 55%,#103d2b) fixed}
body.play{overflow:hidden}
main{width:100%;max-width:480px;margin:0 auto;padding:12px 16px 18px}
body.play main{max-width:none;padding:0}
button{font:inherit}
.t{aspect-ratio:3/4;width:100%;background:linear-gradient(#fbf6e6,#efe6cc);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:20px;line-height:1;color:#111;box-shadow:0 2px 0 #c9bb93,0 3px 4px rgba(0,0,0,.35);user-select:none}
.t i{width:6px;height:6px;border-radius:50%;margin-top:3px;display:block}
.t.ok{outline:2px solid var(--gold);outline-offset:-3px}
.ghost{position:fixed;transform:translate(-50%,-60%) scale(1.15);pointer-events:none;z-index:50}
/* menü */
.logo{display:flex;justify-content:center;gap:8px;margin:2px 0}
.lt{width:clamp(38px,11vw,52px);aspect-ratio:3/4;background:linear-gradient(#fbf6e6,#efe6cc);border-radius:8px;box-shadow:0 4px 0 #c9bb93,0 8px 12px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:clamp(20px,6.4vw,30px);color:var(--c);line-height:1}
.lt i{width:8px;height:8px;border-radius:50%;background:var(--c);margin-top:4px}
.lt:nth-child(odd){transform:rotate(-4deg)}.lt:nth-child(even){transform:rotate(3deg) translateY(2px)}
.tag{text-align:center;margin:6px 0 12px;opacity:.85;font-size:14px}
.menu{display:grid;gap:10px}
.mbtn{display:flex;align-items:center;gap:14px;width:100%;padding:11px 14px;border:0;border-radius:16px;text-align:left;color:#fff4df;cursor:pointer;background:linear-gradient(#a8692f,#7b4b25);box-shadow:0 4px 0 #4e2f12,0 8px 14px rgba(0,0,0,.35);touch-action:manipulation;transition:transform .14s,filter .14s}
.mbtn.gold{background:linear-gradient(#f0bd48,#cc8f1c);color:#2a1d05;box-shadow:0 4px 0 #8a5d0c,0 8px 14px rgba(0,0,0,.35)}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #4e2f12}
.mbtn:disabled{opacity:.45;cursor:default}
.mbtn b{display:block;font-size:18px}.mbtn small{display:block;font-size:13px;font-weight:400;opacity:.85;margin-top:2px}
.mi{font-size:24px;width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,.2);display:grid;place-items:center;flex:none}
.link{background:none;border:0;color:#cfe8d8;font-size:14px;text-decoration:underline;padding:8px;cursor:pointer;justify-self:center}
.wait{text-align:center;opacity:.85;font-size:14px;margin:0}
.cross{display:grid;grid-template-columns:1fr 1.1fr 1fr;grid-template-areas:". t ." "l c r" ". b .";gap:8px;margin:0;align-items:center}
.sp{background:linear-gradient(#f6f6f6,#bdbdbd);border:2px solid #8b8b8b;border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#4a2d14;font-size:13px;text-align:center;min-height:84px;justify-content:center;box-shadow:0 4px 8px rgba(0,0,0,.3)}
.sp.empty{background:rgba(0,0,0,.2);border:2px dashed rgba(255,255,255,.35);color:#f3ecd8;box-shadow:none}
.sp b{overflow-wrap:anywhere}.sp small{opacity:.7;font-size:11px}
.sp .sit{padding:6px 14px;border:0;border-radius:10px;background:var(--gold);color:#2a1d05;font-weight:700;cursor:pointer}
.sp.t{grid-area:t;aspect-ratio:auto}.sp.l{grid-area:l}.sp.r{grid-area:r}.sp.b{grid-area:b}
.cross .c{grid-area:c;text-align:center}.cross .c b{font-size:30px;display:block}.cross .c small{opacity:.7}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#2a1d05;font-weight:800}
.help{background:var(--card);color:var(--ink);border-radius:16px;padding:16px 18px}
.help h3{margin:0 0 8px;font-size:20px}
.help ol{padding-left:20px;margin:0 0 14px;line-height:1.55;font-size:14px}
.help li{margin-bottom:6px}
/* masa */
.stage{container-type:inline-size;position:relative;width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;margin:0 auto;overflow:hidden;color:#f3ecd8;user-select:none;-webkit-user-select:none;--e:max(22px,4.6cqw);--tw:6.3cqw;--fs:4.3cqw;--ds:1.2cqw;
background:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px) 0 0/100% 5.33%,linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px) 0 0/3% 100%,radial-gradient(ellipse at 50% 42%,#2c8d5f,#1b6a45 60%,#134f35)}
.stage .t{border-radius:.9cqw;font-size:var(--fs);box-shadow:0 .35cqw 0 #c9bb93,0 .7cqw 1cqw rgba(0,0,0,.35)}
.stage .t i{width:var(--ds);height:var(--ds);margin-top:.5cqw}
.stage .t.ok{outline-width:.35cqw;outline-offset:-.5cqw}
.stage .t.back b{font-size:calc(var(--fs)*.75);color:#222}
.edge{position:absolute;background:linear-gradient(#9b6330,#6c3f18);box-shadow:0 .5cqw 1cqw rgba(0,0,0,.4);z-index:2}
.etop{left:30cqw;width:40cqw;top:0;height:3.2cqw;border-radius:0 0 1.2cqw 1.2cqw}
.eleft,.eright{top:13cqw;height:26cqw;width:var(--e)}
.eleft{left:0;border-radius:0 1.2cqw 1.2cqw 0}.eright{right:0;border-radius:1.2cqw 0 0 1.2cqw}
.plate{background:linear-gradient(#f6f6f6,#bdbdbd);border:.3cqw solid #8b8b8b;border-radius:1cqw;color:#4a2d14;font-weight:800;font-size:max(11px,2.3cqw);display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;box-shadow:0 .4cqw .8cqw rgba(0,0,0,.35)}
.etop .plate{position:absolute;left:5cqw;right:5cqw;top:1.2cqw;height:4.6cqw}
.eleft .plate,.eright .plate{position:absolute;top:2.5cqw;bottom:2.5cqw;width:calc(var(--e) - 1cqw);writing-mode:vertical-rl}
.eleft .plate{left:.5cqw;transform:rotate(180deg)}.eright .plate{right:.5cqw}
.edge.act .plate,.me.act .plate{animation:glow 1.4s infinite}
.tops{position:absolute;display:flex;gap:.25cqw}
.tops i{width:1.5cqw;height:2cqw;background:#f3ecd8;border-radius:.3cqw .3cqw 0 0;box-shadow:inset 0 -.5cqw 0 #cbbd95}
.etop .tops{top:6cqw;left:0;right:0;justify-content:center}
.eleft .tops,.eright .tops{top:0;bottom:0;flex-direction:column;justify-content:center}
.eleft .tops{left:calc(var(--e) + .3cqw)}.eright .tops{right:calc(var(--e) + .3cqw)}
.eleft .tops i,.eright .tops i{width:2cqw;height:1.5cqw;border-radius:.3cqw}
.pile{position:absolute;width:var(--tw);aspect-ratio:3/4;z-index:3}
.pile .t{position:absolute;width:100%}
.ptl{left:12cqw;top:7.5cqw}.ptr{right:12cqw;top:7.5cqw}.pbl{left:12cqw;top:24cqw}.pbr{right:12cqw;top:24cqw}
.pile.empty{border:.3cqw dashed rgba(255,255,255,.18);border-radius:1cqw}
.pile.mydisc{border:.35cqw dashed rgba(224,168,46,.55);border-radius:1cqw}
.pile.mydisc.armed{animation:glow 1.4s infinite}
.pile.mydisc::before{content:"";position:absolute;inset:-2.5cqw}
.stage .takeable{box-shadow:0 0 0 .5cqw #b9f03c,0 0 2.2cqw #b9f03c;cursor:grab;touch-action:none}
.mid3{position:absolute;left:50%;top:13cqw;transform:translateX(-50%);display:flex;gap:2.2cqw;z-index:3}
.cw{display:flex;flex-direction:column;align-items:center;gap:.6cqw;width:var(--tw)}
.cw small{font-size:max(9px,1.3cqw);opacity:.7}
.deck{width:100%;cursor:grab;touch-action:none;border-radius:.9cqw}
.deck.armed .t{box-shadow:0 0 0 .5cqw #b9f03c,0 0 2.2cqw #b9f03c}
.okeyzone{display:block;width:100%;position:relative}
.okeyzone::before{content:"";position:absolute;inset:-1.5cqw}
.okeyzone>.t{outline:.35cqw solid #e0a82e;outline-offset:0}
.okeyzone.armed{animation:glow 1.4s infinite}
.okeyzone .fin{position:absolute;width:75%;left:35%;top:-12%;transform:rotate(-8deg);z-index:2}
#msg{position:absolute;left:50%;top:9.6cqw;transform:translateX(-50%);background:rgba(0,0,0,.35);padding:.5cqw 2cqw;border-radius:2cqw;font-size:max(11px,1.8cqw);white-space:nowrap;z-index:4}
.me{position:absolute;left:50%;top:27.5cqw;transform:translateX(-50%);width:20cqw;height:3.6cqw;z-index:3}
.me .plate{width:100%;height:100%}
.spec{position:absolute;left:0;right:0;bottom:3cqw;text-align:center;font-size:max(12px,2cqw)}
#rack{position:absolute;left:9cqw;right:9cqw;bottom:0;z-index:4;padding:2cqw 3.4cqw;display:grid;grid-template-columns:repeat(12,1fr);gap:2.4cqw 0;border-radius:1.4cqw 1.4cqw 0 0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 .5cqw,transparent .5cqw 1.6cqw),linear-gradient(#a8692f,#8a5429 55%,#a8692f);box-shadow:inset 0 0 2cqw rgba(0,0,0,.35),0 -.6cqw 2cqw rgba(0,0,0,.35)}
#rack::before,#rack::after{content:"";position:absolute;top:-.8cqw;bottom:0;width:3cqw;border-radius:1cqw 1cqw 0 0;box-shadow:0 0 1cqw rgba(0,0,0,.4);background:radial-gradient(circle at 50% 14%,#e2b07a 0 .45cqw,transparent .55cqw),radial-gradient(circle at 50% 60%,#e2b07a 0 .45cqw,transparent .55cqw),linear-gradient(90deg,#6b3d17,#a56a31 50%,#6b3d17)}
#rack::before{left:-1cqw}#rack::after{right:-1cqw}
.s{aspect-ratio:3/4;position:relative;z-index:0;padding:0 .15cqw;border-radius:.6cqw;cursor:grab;touch-action:none;transition:transform .12s}
.s::after{content:"";position:absolute;left:0;right:0;bottom:-1.3cqw;height:1.1cqw;background:linear-gradient(#c58a50,#8b5529);border-radius:.3cqw;z-index:-1}
.s.sel{transform:translateY(-1cqw)}
.s.sel .t{outline:.3cqw solid #fff}
.s:focus-visible{outline:.3cqw solid #fff}
.hbtn{position:absolute;left:1.2cqw;top:1.2cqw;width:max(32px,5.2cqw);height:max(32px,5.2cqw);padding:0;border-radius:1.2cqw;background:#fff6e8;border:.45cqw solid #d9822b;color:#d9822b;font-size:max(16px,3cqw);font-weight:800;z-index:6;cursor:pointer}
.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);z-index:20}
.win{width:min(88%,64cqw);background:var(--card);color:var(--ink);border-radius:16px;padding:14px;text-align:center;font-size:max(12px,1.8cqw);animation:pop .5s ease-out}
.win b{font-size:max(15px,2.6cqw)}
.pk{display:grid;gap:.8cqw;margin:1.4cqw 0}
.pk{grid-template-columns:repeat(8,1fr)}
.pk .t{font-size:max(9px,2.4cqw);box-shadow:none;border-radius:.5cqw}
.pk .t i{display:none}
.tmr{position:absolute;left:calc(100% + 1cqw);top:0;height:100%;display:flex;align-items:center;padding:0 1.6cqw;border-radius:2cqw;background:rgba(0,0,0,.45);color:#f3ecd8;font-weight:800;font-size:max(11px,2cqw);white-space:nowrap}
.tmr.low{background:#c62828;color:#fff;animation:glow 1s infinite}
@keyframes drop{from{transform:translateY(-30px) scale(1.8);opacity:0}to{transform:none;opacity:1}}
@keyframes fresh{from{transform:translateY(-44px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes dealin{from{transform:translateY(-34px);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{50%{box-shadow:0 0 0 .6cqw rgba(224,168,46,.8)}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.drop{animation:drop .45s ease-out}.fresh{animation:fresh .4s ease-out}.dealin{animation:dealin .4s ease-out backwards}
.t.jk{background:linear-gradient(#fbf6e6,#efe6cc)}.t.jk.ok{outline:none}
.flipin{animation:flipy .45s ease-out}
@keyframes flipy{from{transform:perspective(400px) rotateY(90deg)}to{transform:perspective(400px) rotateY(0)}}
/* kazanan kartı + mini ahşap ıstaka */
.wcard{position:absolute;left:50%;top:3.4cqw;transform:translateX(-50%);z-index:8;width:max-content;max-width:74cqw;display:flex;flex-direction:column;align-items:center;gap:.9cqw;padding:1.1cqw 2cqw 1.3cqw;border-radius:1.8cqw;background:linear-gradient(#fffaf0,#f3e6c4);color:#2a1d05;border:.3cqw solid var(--gold);box-shadow:0 .8cqw 2.6cqw rgba(0,0,0,.5);animation:wpop .5s ease-out}
.wcard.okf{border-color:#ffcf3a;background:linear-gradient(#fff6d6,#f6dc8e);box-shadow:0 0 0 .4cqw rgba(255,207,58,.45),0 0 3cqw rgba(255,207,58,.75),0 .8cqw 2.6cqw rgba(0,0,0,.5)}
@keyframes wpop{from{transform:translateX(-50%) scale(.7);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.whd{display:flex;align-items:center;gap:1.2cqw}
.wav{width:4.4cqw;height:4.4cqw;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 .3cqw var(--gold)}
.wtt{font-weight:900;font-size:max(14px,2.5cqw);white-space:nowrap;line-height:1.15}
.wtt small{display:block;font-weight:600;font-size:max(10px,1.4cqw);opacity:.7;margin-top:.2cqw}
.wcard.okf .wtt{color:#7a4a00}
.wfin{display:flex;flex-direction:column;align-items:center;gap:.25cqw;font-size:max(9px,1.1cqw);font-weight:700;opacity:.9}
.stage .wfin .t{width:3cqw;font-size:max(10px,2cqw);border-radius:.45cqw;box-shadow:0 .2cqw 0 #c9bb93}
.stage .wfin .t i{width:.7cqw;height:.7cqw;margin-top:.3cqw}
.stage .wfin .t.ok{outline:.3cqw solid var(--gold);outline-offset:-.1cqw}
.wrk{position:relative;display:flex;flex-direction:column;gap:1.2cqw;padding:1cqw 3cqw .6cqw;border-radius:1cqw 1cqw .5cqw .5cqw;background:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 .5cqw,transparent .5cqw 1.6cqw),linear-gradient(#a8692f,#8a5429 55%,#a8692f);box-shadow:inset 0 0 1.4cqw rgba(0,0,0,.35),0 .5cqw 1.2cqw rgba(0,0,0,.35)}
.wrk::before,.wrk::after{content:"";position:absolute;top:-.6cqw;bottom:0;width:2.2cqw;border-radius:.8cqw .8cqw .3cqw .3cqw;box-shadow:0 0 .8cqw rgba(0,0,0,.4);background:radial-gradient(circle at 50% 14%,#e2b07a 0 .35cqw,transparent .45cqw),radial-gradient(circle at 50% 60%,#e2b07a 0 .35cqw,transparent .45cqw),linear-gradient(90deg,#6b3d17,#a56a31 50%,#6b3d17)}
.wrk::before{left:-.6cqw}.wrk::after{right:-.6cqw}
.wrow{position:relative;display:flex;justify-content:center;gap:1.6cqw;padding-bottom:.9cqw}
.wrow::after{content:"";position:absolute;left:-1cqw;right:-1cqw;bottom:0;height:.9cqw;background:linear-gradient(#c58a50,#8b5529);border-radius:.3cqw;box-shadow:0 .2cqw .4cqw rgba(0,0,0,.35)}
.wrk .gp{position:relative;z-index:1;display:flex;gap:.25cqw}
.stage .wrk .t{width:3.5cqw;font-size:max(11px,2.5cqw);border-radius:.5cqw;box-shadow:0 .25cqw 0 #c9bb93}
.stage .wrk .t i{width:.8cqw;height:.8cqw;margin-top:.35cqw}
.stage .wrk .t.ok{outline:.35cqw solid var(--gold);outline-offset:-.1cqw;box-shadow:0 .25cqw 0 #c9bb93,0 0 1cqw rgba(224,168,46,.9)}
.wcard.drw{gap:1.2cqw;padding:1.4cqw 3cqw}
.wcard .wb small{font-size:max(10px,1.4cqw);opacity:.75}
.wb{display:flex;gap:1cqw;align-items:center}
.mb2{border:0;border-radius:1.4cqw;padding:.7cqw 1.8cqw;font-size:max(11px,1.8cqw);font-weight:700;background:#2a1d05;color:#fff4df;cursor:pointer}
.mb2.alt{background:transparent;color:#2a1d05;border:.25cqw solid #2a1d05}
#rack.won{box-shadow:inset 0 0 2cqw rgba(0,0,0,.35),0 0 0 .5cqw #e0a82e,0 0 3cqw rgba(224,168,46,.7)}
.seghd{text-align:center;font-size:12px;opacity:.8;margin:2px 0 6px}
.seg{display:flex;gap:6px;background:rgba(0,0,0,.25);padding:4px;border-radius:14px;margin-bottom:10px}
.seg button{flex:1;border:0;border-radius:10px;padding:8px 6px;background:transparent;color:#f3ecd8;font-weight:700;cursor:pointer}
.seg button.on{background:var(--gold);color:#2a1d05}
.seg button:disabled{opacity:.6;cursor:default}
.ver{text-align:center;font-size:11px;opacity:.5;margin:8px 0 0}
.xbtn{left:auto;right:1.2cqw}
.xov .win{width:min(88%,52cqw)}.xov .wb{margin-top:2cqw;justify-content:center;gap:2cqw}
.xov .mb2{font-size:max(13px,2.4cqw);padding:1cqw 3cqw}
.sbtn{left:calc(max(32px,5.2cqw) + 2.4cqw)}
.avs{display:block;width:100%;height:100%;border-radius:50%}
.av{overflow:hidden}.av.e{background:rgba(255,255,255,.2);color:#f3ecd8}
.sp .av{width:44px;height:44px}
.pbar{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.28);border:1px solid rgba(224,168,46,.55);border-radius:999px;padding:5px 14px 5px 5px;color:#f3ecd8;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);flex:1;min-width:0;transition:border-color .15s,background .15s}
.pbar .pavr{width:40px;height:40px;border-radius:50%;flex:none;overflow:hidden;box-shadow:0 0 0 2px #e0a82e,0 0 0 4px rgba(224,168,46,.25)}
.pbar .pnm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.pbar b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar .pst{font-size:12px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .pen{width:19px;height:19px;color:#e0a82e;flex:none}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.tbtn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;width:50px;height:50px;padding:0;border-radius:50%;background:rgba(0,0,0,.28);border:1px solid rgba(224,168,46,.55);color:#f3ecd8;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);touch-action:manipulation;transition:border-color .15s,background .15s,opacity .15s,transform .12s}
.tbtn svg{width:21px;height:21px;color:#e0a82e;flex:none}
.tbtn.off{opacity:.52}.tbtn.off svg{color:#cbbd95}
.tbtn .tlbl{display:none;font-size:13px;font-weight:700;white-space:nowrap}
.tbtn:active{transform:scale(.95)}
.grid2{display:flex;flex-direction:column;gap:10px}
.panel{display:flex;flex-direction:column;gap:10px}
.phdr{display:none;font-size:12px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:#f3c95b;opacity:.9;margin:0 0 2px}
.mstat{display:none;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px}
.mstat span{display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.24);border:1px solid rgba(224,168,46,.28);border-radius:12px;padding:10px 4px}
.mstat b{font-size:21px;color:#f6cb5c;line-height:1.15}
.mstat small{font-size:11px;opacity:.75;margin-top:2px}

const RN=(()=>{const t=[];for(let n=1;n<=13;n++){const o=[];

function coz(c,J){
  let r=-1,n=0;
  outer:for(let a=0;a<4;a++)for(let b=1;b<=13;b++)if(c[a][b]>0){r=a;n=b;break outer}
  if(r<0)return J==0||J>=3;
  for(const [s,e] of RN[n]){
    let need=0;for(let p=s;p<=e;p++)if(c[r][p>13?1:p]<=0)need++;
    if(need>J)continue;
    const used=[];for(let p=s;p<=e;p++){const i=p>13?1:p;if(c[r][i]>0){c[r][i]--;used.push(i)}}
    const ok=coz(c,J-need);used.forEach(x=>c[r][x]++);if(ok)return true;
  }
  const dg=[0,1,2,3].filter(o=>o!=r&&c[o][n]>0);
  for(let m=0;m<(1<<dg.length);m++){
    const sec=dg.filter((o,i)=>m>>i&1);

      c[r][n]--;sec.forEach(o=>c[o][n]--);

    }

}

function put(id,j,left,from){

    if(g.length)out.push(g.join(","))}

function pz(c,J){
  let r=-1,n=0;
  outer:for(let a=0;a<4;a++)for(let b=1;b<=13;b++)if(c[a][b].length){r=a;n=b;break outer}
  if(r<0)return J.length==0?[]:J.length>=3?[J.join(",")]:null;
  for(const [s,e] of RN[n]){
    const used=[],g=[];let need=0;
    for(let p=s;p<=e;p++){const i=p>13?1:p,q=c[r][i];if(q.length){const id=q.pop();used.push([i,id]);g.push(id)}else{need++;g.push(null)}}
    if(need<=J.length){

  }
  const dg=[0,1,2,3].filter(o=>o!=r&&c[o][n].length);

    const sec=dg.filter((o,i)=>m>>i&1);

function partition(h){

function nb(h,id){
  const t=T(id);let p=0;
  for(const o of h){if(o===id||isJ(o))continue;const u=T(o);
    if(u.r==t.r){let d=Math.abs(u.n-t.n);if(d==12)d=1;if(d==1)p+=3;else if(d==2)p+=1.5;else if(d==0)p+=.4}

function cover(h){
  const c=[0,1,2,3].map(()=>Array(15).fill(0));let J0=0;
  h.forEach(id=>{if(isJ(id))J0++;else{const t=T(id);c[t.r][t.n]++}});
  let best=0,nodes=0;
  (function go(k,J,cov){
    if(nodes++>2500)return;
    while(k<52&&c[(k/13)|0][k%13+1]==0)k++;
    if(k>=52){const v=cov+((cov>0||J>=3)?J:0);if(v>best)best=v;return}
    const r=(k/13)|0,n=k%13+1;
    for(const [s,e] of RN[n]){
      let need=0;for(let p=s;p<=e;p++)if(c[r][p>13?1:p]<=0)need++;
      if(need>J)continue;
      const used=[];for(let p=s;p<=e;p++){const i=p>13?1:p;if(c[r][i]>0){c[r][i]--;used.push(i)}}
      go(k,J-need,cov+e-s+1);used.forEach(x=>c[r][x]++);

function deadMap(){const m={};for(let i=0;i<4;i++)S.disc[i].forEach(id=>{if(!isJ(id)){const t=T(id),k=t.r*14+t.n;m[k]=(m[k]||0)+1}});return m}

function pickDiscard(h,lvl){

    if(jc){jc.oninput=()=>{jc.value=jc.value.replace(/\D/g,"").slice(0,4);joinVal=jc.value};jc.onkeydown=e=>{if(e.key=="Enter")joinRoom(jc.value)}}
    on("jgo",()=>joinRoom(jc?jc.value:joinVal));
    return;
  }
  mySeat=S.seats.findIndex(x=>x.u===me);
  if(S.phase=="lobby"){
    scr("lobby");inLobby=true;wasMine=doneSeen=false;confirmExit=false;
    const pos=["b","r","t","l"],cnt=S.seats.filter(s=>s.k!="e").length,isH=S.host===me;
    const card=(s,i)=>`<div class="sp ${pos[i]}${s.k=="e"?" empty":""}"><span class="av${s.k=="e"?" e":""}">${s.k=="e"?"+":avOf(s,i)}</span><b>${s.k=="e"?"Boş koltuk":esc(s.n)}</b>${s.u===S.host?"<small>masa sahibi</small>":""}${s.u===me?"<small>sen</small>":""}${s.k=="e"&&mySeat<0?`<button class="sit" data-i="${i}">Otur</button>`:""}</div>`;
    app.innerHTML=`${topBarHtml()}<div class="grid2 lob"><div class="panel">${roomCode?`<div class="rcode" id="rcopy" role="button" tabindex="0" title="Oda kodunu kopyala" aria-label="Oda kodunu kopyala"><small>ODA KODU</small><b>${esc(roomCode)}</b><span class="rcic">${IC.copy}<span>Kopyala</span></span></div>`:""}<div class="cross">${S.seats.map(card).join("")}<div class="c"><b>${cnt}/4</b><small>oyuncu</small></div></div></div><div class="panel"><div class="phdr">Masa Ayarları</div><div>${segHtml()}</div><div class="menu">${isH?`<button class="mbtn gold" id="go"><span class="mi">▶</span><span><b>Başlat</b><small>${cnt<4?"Boş koltuklara bot gelir":"Masa dolu"}</small></span></button>`:`<p class="wait">Masa sahibinin başlatması bekleniyor…</p>`}${roomCode?`<button class="mbtn" id="iv"><span class="mi">🔗</span><span><b>Arkadaşını davet et</b><small>Oda bağlantısını paylaş veya kopyala</small></span></button>`:""}</div>${inv?`<p class="toast">${esc(inv)}</p>`:""}<button class="dbtn" id="cm">${isH?IC.trash:IC.exit}<span>${isH?"Masayı iptal et":"Odadan ayrıl"}</span></button></div></div><p class="ver">v${APP_VERSION}</p>`;
    app.querySelectorAll(".sit").forEach(b=>b.onclick=()=>sit(+b.dataset.i));
    bindProf();bindLv();on("go",deal);on("iv",invite);on("cm",closeTable);on("rcopy",copyCode);const rc=$("rcopy");if(rc)rc.onkeydown=k=>{if(k.key=="Enter"||k.key==" "){k.preventDefault();copyCode()}};return;
  }
  scr("play");
  const v=mySeat<0?0:mySeat,R=k=>(v+k)%4,h=S.hands[v]||[];
  let anim=false;
  if(dealKey!==S.dealId){anim=inLobby||dealKey!==null;dealKey=S.dealId;flipped.clear();if(anim)snd("shuffle");known=anim?new Set():new Set(h);seenD=anim?new Set():new Set([0,1,2,3].flatMap(i=>S.disc[i]))}
  inLobby=false;
  slots=slots.map(x=>h.includes(x)?x:null);
  h.forEach(x=>{if(!slots.includes(x))slots[slots.indexOf(null)]=x});
  if(sel!==null&&slots[sel]==null)sel=null;
  let st;
  if(S.phase=="done")st=S.win==-2?"Deste bitti, oyun berabere.":`${esc(S.seats[S.win].n)} bitirdi!`;
  else st=S.turn==mySeat?(S.step=="draw"?"Sıra sende: ortadan ya da soldan bir taş al.":"Sıra sende: bir taş at."):`Sıra: ${esc(S.seats[S.turn].n)}`;
  const armed=myTurn()&&S.step=="discard",drawArm=myTurn()&&S.step=="draw";
  const dn=S.phase=="done",doneW=dn&&S.win>=0,myWin=doneW&&S.win===mySeat,okFin=doneW&&S.fin>=0&&isJ(S.fin);
  let idx=0;
  const rackHtml=slots.map((x,i)=>{
    let c=x!=null&&isJ(x)?" ok":"",stl="";
    if(x!=null&&!dn){if(anim){c+=" dealin";stl=`animation-delay:${(idx++)*35}ms`}else if(!known.has(x))c+=" fresh";if(flipAnim===x)c+=" flipin"}
    return `<div class="s${sel===i&&!dn?" sel":""}" tabindex="0" data-i="${i}">${x!=null?(!myWin&&flipped.has(x)&&isJ(x)?jk(c,stl):tl(x,c,stl)):""}</div>`}).join("");
  const dcls=id=>seenD.has(id)?"":" drop";
  const hostBtns=S.host===me?`<button class="mb2" id="nw">Yeni el</button><button class="mb2 alt" id="cm">Ana menü</button>`:`<small>Yeni eli masa sahibi başlatır</small><button class="mb2 alt" id="cm">Ana menü</button>`;
  let win="";
  if(dn){
    const btns=`<span class="wb">${hostBtns}</span>`;
    if(doneW){
      const ws=S.seats[S.win],ok=id=>isJ(id)?" ok":"";
      const gs=(S.wg&&S.wg.length?S.wg:[S.hands[S.win].join(",")]).map(g=>String(g).split(",").filter(x=>x!=="").map(Number));
      const cap=cols()==8?8:16,rows=[];let row=[],n=0;
      for(let g of gs){
        while(g.length>cap){if(row.length){rows.push(row);row=[];n=0}rows.push([g.slice(0,cap)]);g=g.slice(cap)}
        if(!g.length)continue;
        if(n&&n+g.length>cap){rows.push(row);row=[];n=0}
        row.push(g);n+=g.length;
      }
      if(row.length)rows.push(row);
      win=`<div class="wcard${okFin?" okf":""}"><div class="whd"><span class="wav">${avOf(ws,S.win)}</span><div class="wtt">${okFin?"🌟🏆 "+esc(ws.n)+" OKEYLE bitirdi!":"🏆 "+esc(ws.n)+" kazandı!"}<small>${myWin?"Tebrikler, eli sen bitirdin!":"Kazananın ıstakası"}</small></div>${S.fin>=0?`<span class="wfin">${tl(S.fin,ok(S.fin))}<span>Bitiş</span></span>`:""}</div><div class="wrk">${rows.map(r=>`<div class="wrow">${r.map(g=>`<span class="gp">${g.map(id=>tl(id,ok(id))).join("")}</span>`).join("")}</div>`).join("")}</div>${btns}</div>`;
    }else win=`<div class="wcard drw"><div class="wtt">🤝 Deste bitti, oyun berabere.</div>${btns}</div>`;
  }
  const P=(i,pos,mine)=>{
    const d=S.disc[i],vis=d.slice(-5),take=!mine&&mySeat>=0&&i==prev()&&drawArm;
    const tiles=vis.map((id,k)=>{const last=k==vis.length-1,o=(vis.length-1-k)*.55;return tl(id,dcls(id)+(last&&take?" takeable":""),`left:${-o}cqw;top:${-o}cqw`)}).join("");
    return `<div class="pile ${pos}${mine?" mydisc"+(armed?" armed":""):""}${d.length?"":" empty"}" data-p="${i}">${tiles}</div>`;
  };
  const pl=(i,cls)=>`<div class="edge ${cls}${S.turn==i&&S.phase=="play"?" act":""}"><div class="plate">${pav(S.seats[i],i)}<span class="pn">${esc(S.seats[i].n)}${S.seats[i].k=="b"?" · bot":""}</span></div><div class="tops">${"<i></i>".repeat(S.hands[i].length)}</div></div>`;
  const exitMsg=S.host===me?"Maçı iptal edip ana ekrana dönmek istiyor musun?":(roomCode&&mySeat>=0?"Masadan ayrılmak istiyor musun? Yerine bot devam edecek.":"Ana menüye dönmek istiyor musun?");
  app.innerHTML=`<div class="stage">
   <button class="hbtn" id="hp">?</button><button class="hbtn sbtn" id="sb">${muted?"🔇":"🔊"}</button>${mySeat>=0||S.host===me||roomCode?`<button class="hbtn xbtn" id="xb" aria-label="Ana menü">🏠</button>`:""}
   ${pl(R(2),"etop")}${pl(R(3),"eleft")}${pl(R(1),"eright")}
   ${P(R(2),"ptl")}${P(R(1),"ptr")}${P(R(3),"pbl")}${P(v,"pbr",mySeat>=0)}
   <div class="mid3">
    <div class="cw">${tl(S.g)}<small>Gösterge</small></div>
    <div class="cw"><span class="okeyzone${armed?" armed":""}"><div class="t"><b style="color:${COL[S.ok.r]}">${S.ok.n}</b><i style="background:${COL[S.ok.r]}"></i></div>${S.fin>=0?`<span class="fin">${tl(S.fin," drop")}</span>`:""}</span><small>Okey</small></div>
    <div class="cw"><div class="deck${drawArm?" armed":""}"><div class="t back"><b>${S.deck.length}</b></div></div><small>Deste</small></div>
   </div>
   <div id="msg"${S.phase=="done"?" hidden":""}>${S.ev?esc(S.ev)+" · ":""}${st}${note?" "+esc(note):""}</div>
   ${mySeat<0?`<div class="spec">İzleyicisin</div>`:`<div class="me${myTurn()?" act":""}"><div class="plate">${pav(S.seats[mySeat],mySeat)}<span class="pn">${esc(S.seats[mySeat].n)}</span></div>${myTurn()?`<span id="tm" class="tmr">⏱ ${tLeft}</span>`:""}</div><div id="rack"${myWin?` class="won"`:""}>${rackHtml}</div>`}
   ${win}
   ${confirmExit?`<div class="ov xov"><div class="win"><b>${exitMsg}</b><span class="wb"><button class="mb2" id="xno">Vazgeç</button><button class="mb2 alt" id="xyes">Evet, çık</button></span></div></div>`:""}
   ${peek>=0?`<div class="ov pkov"><div class="win"><b>${esc(S.seats[peek].n)}</b><div class="pk">${S.disc[peek].map(id=>tl(id)).join("")||"Henüz taş atmadı"}</div></div></div>`:""}
  </div>`;
  const nd=[0,1,2,3].reduce((a,i)=>a+S.disc[i].filter(id=>!seenD.has(id)).length,0);
  if(nd&&!anim)snd("drop");
  const mine=myTurn();if(mine&&!wasMine){snd("turn");tLeft=50}wasMine=mine;
  if(S.ev&&S.evn!==lastEvn&&lastEvn!==-1&&!anim)snd("draw");lastEvn=S.evn||0;
  if(dn){if(!doneSeen){doneSeen=true;snd(okFin?"winOk":S.win==mySeat?"win":"lose")}}else doneSeen=false;
  if(dn&&mySeat>=0&&S.dealId&&prof&&prof.lastDeal!==S.dealId){prof.lastDeal=S.dealId;prof.stats.games++;if(myWin){prof.stats.wins++;if(okFin)prof.stats.okeyWins++}storeProf()}
  flipAnim=-1;known=new Set(h);[0,1,2,3].forEach(i=>S.disc[i].forEach(id=>seenD.add(id)));
  on("hp",helpOn);on("sb",toggleSnd);on("nw",deal);on("cm",closeTable);on("xb",openExit);on("xno",()=>{confirmExit=false;render()});on("xyes",closeTable);
  timerSync();
  botCheck();
}
const appEl=$("app");
appEl.addEventListener("pointerdown",e=>{
  if(mySeat<0||!S||S.phase!="play")return;
  const s=e.target.closest(".s"),dk=e.target.closest(".deck"),tk=e.target.closest(".takeable");
  const el=s||dk||tk;if(!el)return;
  const w=el.getBoundingClientRect().width;
  if(s){const i=+s.dataset.i;if(slots[i]==null)return;drag={src:"rack",i,w,x:e.clientX,y:e.clientY,moved:false,g:null};return}
  if(myTurn()&&S.step=="draw")drag={src:dk?"deck":"take",i:-1,w:dk?w*.8:w,x:e.clientX,y:e.clientY,moved:false,g:null};
});
addEventListener("pointermove",e=>{
  if(!drag)return;
  if(!drag.moved){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;
    drag.moved=true;snd("pick");
    const g=document.createElement("div");g.className="ghost";g.style.width=drag.w+"px";g.style.fontSize=(drag.w*.68)+"px";
    g.innerHTML=drag.src=="deck"?'<div class="t"></div>':tl(drag.src=="take"?S.disc[prev()].slice(-1)[0]:slots[drag.i]);
    document.body.appendChild(g);drag.g=g;
  }
  drag.g.style.left=e.clientX+"px";drag.g.style.top=e.clientY+"px";
});
function endDrag(e,cancel){
  if(!drag)return;const d=drag;drag=null;
  if(d.g)d.g.remove();
  if(!d.moved)return;
  lastDrag=Date.now();
  const el=cancel?null:document.elementFromPoint(e.clientX,e.clientY);
  const tg=el&&el.closest(".s,.mydisc,.okeyzone,#rack");
  const rc=tg?tg.getBoundingClientRect():null,lf=rc?e.clientX<rc.left+rc.width/2:true;
  if(d.src!="rack"){const f=d.src=="deck"?cek:al;if(tg&&tg.classList.contains("s"))f(+tg.dataset.i,lf);else if(tg&&tg.id=="rack")f();else render();return}
  if(tg&&tg.classList.contains("s")){const j=+tg.dataset.i;if(j!==d.i)put(slots[d.i],j,lf,d.i);sel=null;note=""}
  else if(tg&&tg.classList.contains("mydisc")){sel=d.i;at();return}
  else if(tg&&tg.classList.contains("okeyzone")){sel=d.i;bitir();return}
  render();
}
addEventListener("pointerup",e=>endDrag(e,false));
addEventListener("pointercancel",e=>endDrag(e,true));
appEl.addEventListener("click",e=>{
  if(Date.now()-lastDrag<400)return;
  const s=e.target.closest(".s");
  if(s){if(S.phase!="play")return;const i=+s.dataset.i,id=slots[i],now=Date.now();
    if(id!=null&&isJ(id)&&lastTap[0]===i&&now-lastTap[1]<350){lastTap=[-1,0];if(flipped.has(id))flipped.delete(id);else flipped.add(id);flipAnim=id;sel=null;snd("flip");render();return}
    const rc=s.getBoundingClientRect();lastTap=[i,now];tapSlot(i,e.clientX<rc.left+rc.width/2);return}
  if(e.target.closest(".pkov")){peek=-1;render();return}
  if(e.target.closest(".mydisc")&&sel!==null){at();return}
  if(e.target.closest(".okeyzone")){bitir();return}
  if(e.target.closest(".deck")){cek();return}
  if(e.target.closest(".takeable")){al();return}
  const pe=e.target.closest(".pile");if(pe){peek=+pe.dataset.p;render();return}
});
addEventListener("pointerdown",()=>{ac()},{once:true});
try{matchMedia("(max-aspect-ratio:3/4)").addEventListener("change",()=>{if(S&&S.phase=="done"&&!drag)render()})}catch(e){}
init();
</script>
